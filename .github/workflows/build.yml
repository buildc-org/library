---
name: Build the collection
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legs:
    name: Choose the legs for this event
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          always='[
            {"image":"collection","family":"fedora","base":"quay.io/fedora/fedora-bootc:44"},
            {"image":"bootc-base","family":"debian","base":"docker.io/library/debian:forky"},
            {"image":"bootc-base","family":"ubuntu","base":"docker.io/library/ubuntu:26.04"},
            {"image":"bootc-base","family":"rhel","base":"quay.io/rockylinux/rockylinux:10"},
            {"image":"hardening","family":"rhel","base":"quay.io/centos-bootc/centos-bootc:stream10"},
            {"image":"changed","family":"fedora","base":"quay.io/fedora/fedora-bootc:44"},
            {"image":"changed","family":"debian","base":"docker.io/library/debian:forky"},
            {"image":"changed","family":"ubuntu","base":"docker.io/library/ubuntu:26.04"}
          ]'
          deb='[
            {"image":"collection","family":"debian","base":"docker.io/library/debian:forky"},
            {"image":"collection","family":"ubuntu","base":"docker.io/library/ubuntu:26.04"}
          ]'
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            printf 'include=%s\n' "$(jq -c . <<< "$always")" >> "$GITHUB_OUTPUT"
          else
            printf 'include=%s\n' "$(jq -c -s add <<< "${always}${deb}")" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint the collection's shell and Python
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install shfmt
        env:
          SHFMT_VERSION: "3.13.1"
          SHFMT_SHA256: fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  /tmp/shfmt" | sha256sum -c -
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt

      - name: Lint
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find . -path ./.git -prune -o -name '*.sh' ! -name repo.sh -type f \
            ! \( -path '*/files/*' \( -path '*/libexec/*' -o -path '*/system-generators/*' \) \) -print)
          mapfile -t repos < <(find . -path ./.git -prune -o -name repo.sh -type f -print)
          mapfile -t helpers < <(find . -path ./.git -prune -o -path '*/files/*' -type f \
            \( -path '*/libexec/*' -o -path '*/system-generators/*' \) -print)
          shellcheck -s bash "${scripts[@]}"
          shellcheck -s bash -e SC2034 "${repos[@]}"
          shellcheck "${helpers[@]}"
          shfmt -i 4 -ci -bn -sr -d "${scripts[@]}" "${repos[@]}" "${helpers[@]}"
          echo "::notice::${#scripts[@]} scripts, ${#repos[@]} repo files and ${#helpers[@]} helpers are clean"

      - name: Install ruff
        env:
          RUFF_VERSION: "0.16.9"
          RUFF_SHA256: 1bfbb819b5d4f9af501748862276b60e412d336034d99387691a4d4bce7a6f13
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/ruff.tar.gz \
            "https://github.com/astral-sh/ruff/releases/download/${RUFF_VERSION}/ruff-x86_64-unknown-linux-gnu.tar.gz"
          echo "${RUFF_SHA256}  /tmp/ruff.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/ruff.tar.gz -C /usr/local/bin --strip-components=1

      - name: Lint Python
        run: ruff check

      # The bracket forms keep the search from matching its own pattern line.
      - name: Check that a pull request runs with no secret and a read-only token
        run: |
          set -euo pipefail
          shopt -s nullglob
          all=(.github/workflows/*.yml .github/workflows/*.yaml)
          mapfile -t started < <(grep -l 'pull_request' "${all[@]}")
          found="$({
            grep -HnE 'pull_request[_]target|workflow[_]run|issue[_]comment' "${all[@]}" || true
            grep -HnE '\bsecret[s]\b|:[[:space:]]*["'"'"']?write' "${started[@]}" || true
          } | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#' || true)"
          if [ -n "$found" ]; then
            printf '%s\n' "$found"
            echo "::error::a workflow gives a pull request a secret, a write or the base token"
            exit 1
          fi

      - name: Check that every file states its licence
        env:
          REUSE_IMAGE: docker.io/fsfe/reuse@sha256:85462a75c0f8efda09ddd190b92816b70e7662577c8427429e11e1b9f25a992e
        run: docker run --rm -v "${PWD}:/data:ro" "$REUSE_IMAGE" lint

      - name: Check the CI scripts and the asset pins
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github
          find . -path ./.git -prune -o -name manifest.kdl -print0 | xargs -0 python3 .github/hashed.py

  packages:
    name: package lists ${{ matrix.family }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: debian
            base: docker.io/library/debian:forky
          - family: ubuntu
            base: docker.io/library/ubuntu:26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve every package this family declares
        env:
          FAMILY: ${{ matrix.family }}
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          python3 .github/packages.py "$FAMILY" > lists.txt
          python3 .github/packages.py "$FAMILY" --repos > repos.txt
          echo "::notice::$(wc -l < lists.txt) components declare packages for ${FAMILY}, $(wc -l < repos.txt) of them out of an archive of their own"
          sudo podman run --rm -i -v "${PWD}:/src:ro" "$BASE" \
            bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              mkdir -p /ctx/lib
              cp /src/components/deb/build-environment/lib/family.sh /ctx/lib/
              while read -r repo; do source "/src/$repo"; done < /src/repos.txt
              if [ -s /src/repos.txt ]; then apt-get update -qq; fi
              rc=0
              while read -r component packages; do
                if apt-get install --dry-run -qq $packages > /dev/null 2>&1; then
                  printf "ok   %s\n" "$component"
                else
                  printf "FAIL %s\n" "$component"
                  apt-get install --dry-run $packages 2>&1 | grep -E "^E:" | head -3
                  rc=1
                fi
              done < /src/lists.txt
              exit $rc
            '

  collection:
    name: ${{ matrix.image }} ${{ matrix.family }}
    needs: [legs, lint, packages]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.legs.outputs.include) }}
    env:
      IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      IMAGE: ${{ matrix.image }}
      FAMILY: ${{ matrix.family }}
      # These components cannot build in isolation, so the leg leaves them to a maintainer.
      SKIP: system-menu/goojust system-menu/power-scripts boot/uki boot/secureboot-enrolment
      HARDENING: updates/signature-policy
      CONFORMS: cis_server_l1
      MAX_FAILS: "7"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: ${{ matrix.image == 'changed' && '0' || '1' }}

      - name: Install shfmt
        env:
          SHFMT_VERSION: "3.13.1"
          SHFMT_SHA256: fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  /tmp/shfmt" | sha256sum -c -
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt

      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium
          df -h /

      - name: Settle the container storage driver
        run: |
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf > /dev/null
          sudo podman system reset --force > /dev/null 2>&1 || true
          sudo rm -rf /var/lib/containers/storage /run/containers/storage
          sudo podman info --format 'storage: {{.Store.GraphDriverName}} {{.Store.GraphOptions}}'

      # The released binary reads its assets from the tarball, not from a copy on the runner.
      - name: Install the released tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/buildc"
          mkdir -p "$dir"
          gh release download --repo buildc-org/buildc --dir "$dir" \
            --pattern 'buildc-v*-x86_64-linux-musl.tar.gz*'
          (cd "$dir" && printf '%s  %s\n' "$(cat ./*.sha256)" ./*.tar.gz \
            | sha256sum --check --status)
          tar -xzf "$dir"/*.tar.gz -C "$dir"
          {
            echo "ROOT=${RUNNER_TEMP}/collection"
            echo "NAMES=${RUNNER_TEMP}/names"
            echo "BUILDC_BIN=${dir}/buildc"
            echo "BUILDC_ASSETS=${dir}/assets"
          } >> "${GITHUB_ENV}"

      - name: Choose this leg's components
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          case "$IMAGE" in
            collection)
              mapfile -t all < <(python3 .github/closure.py --features)
              python3 .github/closure.py --split "$FAMILY" "$BASE" "${all[@]}" \
                | awk -v n="$NAMES" '{ print $2 > ($1 == 0 ? n : n "." $1) }'
              for alt in "${NAMES}".[0-9]*; do
                [ -e "$alt" ] || continue
                echo "::notice::$(wc -l < "$alt") components in ${IMAGE}-${alt##*.}"
                cat "$alt"
              done
              ;;
            bootc-base)
              dir=deb
              [ "$FAMILY" = rhel ] && dir=rhel
              find "components/$dir" -mindepth 2 -name manifest.kdl -printf '%h\n' \
                | sed 's|^components/||' | sort -u \
                | xargs -r python3 .github/closure.py "$FAMILY" "$BASE" > "$NAMES"
              ;;
            hardening)
              {
                printf '%s\n' $HARDENING
                find components/hardening -mindepth 2 -name manifest.kdl -printf '%h\n' \
                  | sed 's|^components/||'
              } | sort -u \
                | xargs -r python3 .github/closure.py "$FAMILY" "$BASE" > "$NAMES"
              ;;
            changed)
              # A push or a manual run has no pull request base, so the leg diffs the previous commit.
              from="${FROM:-$(git rev-parse -q --verify HEAD^ || true)}"
              : > "$NAMES"
              if [ -n "$from" ]; then
                git diff --name-only "$from" HEAD | while read -r file; do
                  dir="$(dirname "$file")"
                  while [ "$dir" != "." ]; do
                    if [ -f "${dir}/manifest.kdl" ]; then
                      echo "${dir#components/}"
                      break
                    fi
                    dir="$(dirname "$dir")"
                  done
                done | sort -u \
                  | xargs python3 .github/closure.py "$FAMILY" "$BASE" \
                  | xargs python3 .github/closure.py --split "$FAMILY" "$BASE" \
                  | awk -v n="$NAMES" '{ print $2 > ($1 == 0 ? n : n "." $1) }'
              fi
              ;;
          esac
          echo "::notice::$(wc -l < "$NAMES") components in the ${IMAGE} leg"
          cat "$NAMES"

      # The hardening leg imports only rhel components, so a claim from another family is never measured.
      - name: Refuse a claim outside the hardening set
        if: matrix.image == 'hardening'
        run: |
          set -euo pipefail
          claiming="$(grep -rlE '^[[:space:]]*satisfies' --include=manifest.kdl components \
            | sed 's|^components/||;s|/manifest\.kdl$||' | sort)"
          stray="$(comm -23 <(printf '%s\n' "$claiming") <(sort "$NAMES") || true)"
          for name in $claiming; do
            manifest="components/${name}/manifest.kdl"
            if grep -q '^targets ' "$manifest" && ! grep -qE '^targets .*"rhel"' "$manifest"; then
              stray="${stray:+${stray}$'\n'}${name}"
            fi
          done
          if [ -n "$stray" ]; then
            printf '%s\n' "$stray"
            echo '::error::a component declares `satisfies` and no leg measures it'
            exit 1
          fi

      - name: Scaffold a repository on this collection
        env:
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          "$BUILDC_BIN" create repo "$IMAGE" --root "$ROOT" --no-tui \
            --owner buildc-org --host github.com
          # The splice points the scaffold at this checkout, so the leg tests the tree under review.
          awk -v root="$GITHUB_WORKSPACE" '
            $0 == "sources {" {
              replaced++
              print "sources {"
              print "    components \"buildc\" {"
              print "        dir \"" root "/components\""
              print "    }"
              print "}"
              replacing = 1
              next
            }
            replacing && $0 == "}" { replacing = 0; next }
            !replacing
            END { if (replacing || replaced != 1) exit 1 }
          ' "${ROOT}/repo.kdl" > "${ROOT}/repo.kdl.new"
          mv "${ROOT}/repo.kdl.new" "${ROOT}/repo.kdl"
          for declaration in \
            '    components "buildc" {' \
            "        dir \"${GITHUB_WORKSPACE}/components\""; do
            if [ "$(grep -Fxc "$declaration" "${ROOT}/repo.kdl" || true)" != 1 ]; then
              echo "::error::repo.kdl does not carry exactly one ${declaration}"
              exit 1
            fi
          done
          if grep -qE '^[[:space:]]+(url|path) ' "${ROOT}/repo.kdl"; then
            echo '::error::repo.kdl still carries a remote source'
            exit 1
          fi
          "$BUILDC_BIN" create image "$IMAGE" --root "$ROOT" --no-tui \
            --owner buildc-org --base "$BASE"
          # The generated repo uses a strict network policy, so an undeclared fetch fails the build here.
          printf 'security-policy {\n    network "strict"\n}\n' >> "${ROOT}/repo.kdl"
          alts=("${NAMES}".[0-9]*)
          for alt in "${alts[@]}"; do
            "$BUILDC_BIN" create image "${IMAGE}-${alt##*.}" --root "$ROOT" --no-tui \
              --owner buildc-org --base "$BASE"
          done
          if [ "$IMAGE" = hardening ]; then
            image="${ROOT}/${IMAGE}.image.kdl"
            bases="$(grep -c '^    base-image {' "$image" || true)"
            if [ "$bases" != 1 ]; then
              echo "::error::${image} declares ${bases} images; the conforms splice writes one"
              exit 1
            fi
            sed -i "s|^    base-image {|    conforms \"${CONFORMS}\"\n\n    base-image {|" \
              "$image"
            wrote="$(grep -cx "    conforms \"${CONFORMS}\"" "$image" || true)"
            if [ "$wrote" != 1 ]; then
              echo "::error::${image} carries ${wrote} of that conforms, expected one"
              exit 1
            fi
          fi
          listed() {
            awk '
              /^image \{/ { inside = 1; next }
              inside && /^\}/ { inside = 0; next }
              inside && $1 != "}" && ($1 == "flavour" || NF == 1 || $2 == "{" || $2 ~ /^variant=/) {
                match($0, /^ */)
                depth = RLENGTH / 4
                stack[depth] = ($1 == "flavour") ? "" : $1
                if ($1 == "flavour") next
                path = ""
                for (i = 1; i <= depth; i++) {
                  if (stack[i] != "") path = (path == "" ? stack[i] : path "/" stack[i])
                }
                print path
              }
            ' "$1"
          }
          declare -A keyed=()
          import_into() {
          local image="$1" name
          while read -r name; do
            case " $SKIP " in *" $name "*) continue ;; esac
            manifest="components/${name}/manifest.kdl"
            if grep -q '^targets ' "$manifest" \
              && ! grep -q "^targets .*\"${FAMILY}\"" "$manifest"; then
              continue
            fi
            if listed "${ROOT}/${image}.image.kdl" | grep -qxF "$name"; then
              continue
            fi
            "$BUILDC_BIN" import component "buildc/${name}" --root "$ROOT" \
              --image "$image" --no-tui
            [ -z "${keyed[$name]:-}" ] || continue
            keyed[$name]=1
            case "$name" in
              boot/cachyos-kernel)
                "$BUILDC_BIN" create key secureboot --root "$ROOT" --no-tui \
                  --cn "Collection CI"
                ;;
              login-access)
                "$BUILDC_BIN" create key ssh --root "$ROOT" --no-tui
                ;;
              updates/signature-policy)
                mkdir -p "$ROOT/keys/public/etc/pki/containers"
                openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
                  | openssl pkey -pubout \
                    -out "$ROOT/keys/public/etc/pki/containers/cosign.pub"
                ;;
            esac
          done < "$2"
          }
          import_into "$IMAGE" "$NAMES"
          for alt in "${alts[@]}"; do
            import_into "${IMAGE}-${alt##*.}" "$alt"
          done
          cd "$ROOT" && "$BUILDC_BIN" generate

      - name: Run lint
        run: |
          "${ROOT}/generated/scripts/lint.sh"

      - name: Run the tests of the selected components
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t names < <(sort -u "$NAMES" "${NAMES}".[0-9]*)
          if [ "${#names[@]}" -eq 0 ]; then
            echo "no components in this leg"
            exit 0
          fi
          mapfile -t rooted < <(printf 'components/%s\n' "${names[@]}")
          mapfile -t dirs < <(find "${rooted[@]}" -name 'test_*.py' -type f \
            -exec dirname {} \; | sort -u)
          for dir in ${dirs[@]+"${dirs[@]}"}; do
            python3 -m unittest discover -s "$dir" -v
          done

      - name: Report where components overlap
        if: matrix.image == 'collection'
        run: |
          set -euo pipefail
          rows="$(jq -r '
            .images[].targets[]
            | (.overlay_overridden[]
               | "- `\(.path)`: `\(.component)` ships it, `\(.by)` wins"),
              (.components
               | map(.provides[] as $c | {c: $c, m: .path})
               | group_by(.c)[] | select(length > 1)
               | "- `\(.[0].c)`: \(map("`\(.m)`") | join(", "))")
          ' "${ROOT}/generated/plan.json")"
          {
            echo "## Where ${FAMILY} components overlap"
            echo
            echo "What one component ships and another replaces, and what two of"
            echo "them provide. Read it; it is not a failure."
            echo
            printf '%s\n' "${rows:-None.}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        id: build
        if: >-
          matrix.image != 'changed'
          && (matrix.family == 'fedora' || matrix.image == 'bootc-base'
              || github.event_name != 'pull_request')
        run: |
          set -euo pipefail
          echo "::group::${IMAGE} Containerfile"
          cat "${ROOT}/generated/${IMAGE}/Containerfile"
          echo "::endgroup::"
          cd "$ROOT" && sudo IMAGE_REGISTRY="$IMAGE_REGISTRY" \
            "$BUILDC_BIN" build --no-tui
          shopt -s nullglob
          previous="$IMAGE"
          for alt in "${NAMES}".[0-9]*; do
            target="${IMAGE}-${alt##*.}"
            # Each image is removed before the next build to stay inside the runner's disk budget.
            sudo podman rmi --ignore "${previous}:latest" > /dev/null
            sudo podman image prune -f > /dev/null
            echo "::group::${target} Containerfile"
            cat "${ROOT}/generated/${target}/Containerfile"
            echo "::endgroup::"
            sudo IMAGE_REGISTRY="$IMAGE_REGISTRY" "$BUILDC_BIN" build --no-tui --target "$target"
            previous="$target"
          done

      - name: Lint the built base
        if: matrix.image == 'bootc-base'
        run: |
          set -euo pipefail
          sudo podman run --rm --entrypoint '' "${IMAGE}:latest" \
            bootc container lint --fatal-warnings --no-truncate
          pages="$(sudo podman run --rm --entrypoint '' "${IMAGE}:latest" \
            sh -c 'find /usr/share/man/man1 -maxdepth 1 -type f | wc -l')"
          echo "::notice::the ${FAMILY} bootc base carries ${pages} man1 pages"
          [ "$pages" -gt 0 ]

      - name: Restore the last scan's pass set
        if: matrix.image == 'hardening' && steps.build.outcome != 'skipped'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/baseline.json
          key: scap-machine-${{ matrix.image }}-${{ github.run_id }}
          restore-keys: scap-machine-${{ matrix.image }}-

      - name: Boot the image
        if: matrix.image == 'hardening' && steps.build.outcome != 'skipped'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          sudo chmod 666 /dev/kvm
          "${ROOT}/generated/scripts/smoke.sh" "${IMAGE}:latest" "${RUNNER_TEMP}/vm"

      - name: Evaluate the rules
        if: matrix.image == 'hardening' && steps.build.outcome != 'skipped'
        run: |
          set -euo pipefail
          # The VM's host key is new each run, so the SSH calls do not pin it.
          s() {
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR -i "${RUNNER_TEMP}/vm/key" -p 2222 root@localhost "$@"
          }
          content="$(cd "$ROOT" && "$BUILDC_BIN" scap content --target "$IMAGE")"
          cp "${ROOT}/${content}" "${RUNNER_TEMP}/ds.xml"
          # The scanner installs into /usr, which bootc keeps read-only without the overlay.
          s bootc usr-overlay
          s 'n=0
            until dnf -y install openscap-scanner >/dev/null; do
              n=$((n+1))
              [ "$n" -ge 3 ] && exit 1
              dnf clean all
              sleep 15
            done'
          s 'cat > /tmp/ds.xml' < "${RUNNER_TEMP}/ds.xml"
          (cd "$ROOT" && "$BUILDC_BIN" scap tailoring --target "$IMAGE" \
            --datastream "${RUNNER_TEMP}/ds.xml") | s 'cat > /tmp/tailoring.xml'
          # A failed rule makes oscap exit non-zero, so the check reads the result file instead.
          s oscap xccdf eval \
            --tailoring-file /tmp/tailoring.xml --profile xccdf_buildc_profile_measured \
            --results-arf /tmp/arf.xml /tmp/ds.xml || true
          s cat /tmp/arf.xml > "${RUNNER_TEMP}/arf.xml"
          [ -s "${RUNNER_TEMP}/arf.xml" ]
          echo "DATASTREAM=${RUNNER_TEMP}/ds.xml" >> "$GITHUB_ENV"

      - name: Compare what was declared to what was measured
        if: matrix.image == 'hardening' && steps.build.outcome != 'skipped'
        run: |
          set -euo pipefail
          report="$("$BUILDC_BIN" scap "${RUNNER_TEMP}/arf.xml" \
            --root "$ROOT" --target "$IMAGE" --datastream "$DATASTREAM" \
            --base-scan "${GITHUB_WORKSPACE}/.ci/centos-bootc-stream10-base-scan.json" \
            --baseline "${RUNNER_TEMP}/baseline.json")"
          printf '%s\n' "$report"
          rows="$(printf '%s\n' "$report" | awk '
            /^## / { table = ($0 == "## Declared coverage, measured"); next }
            table && /^\| / && !/^\| (Component|---) /')"
          if [ -z "$rows" ]; then
            echo '::error::the report declared no claim at all'; exit 1
          fi
          bad="$(printf '%s\n' "$rows" | grep -v '| pass |$' || true)"
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            echo '::error::a declared claim was not measured as passing'; exit 1
          fi

          case "$report" in
            *'this run is the baseline.'* | \
              *'Nothing that passed before stopped passing.'*) ;;
            *)
              echo '::error::a rule that passed the last scan does not now'
              exit 1
              ;;
          esac

          fails="$(printf '%s\n' "$report" \
            | awk -F'|' '/\(declared\)/ { gsub(/ /, "", $5); print $5 }')"
          if [ -z "$fails" ]; then
            echo "::error::no profile row is declared, so ${CONFORMS} is not a"\
              "profile this datastream carries"
            exit 1
          fi
          echo "::notice::${IMAGE} fails ${fails} of ${CONFORMS}, floor ${MAX_FAILS}"
          if [ "$fails" -gt "$MAX_FAILS" ]; then
            echo "::error::${fails} failures against a declared floor of"\
              "${MAX_FAILS}; fix them, or choose a new floor deliberately"
            exit 1
          fi
          if [ "$fails" -lt "$MAX_FAILS" ]; then
            echo "::notice::the floor is loose and could come down to ${fails}"
          fi

      - name: Keep the scan report
        if: always() && matrix.image == 'hardening' && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arf-${{ matrix.image }}
          path: ${{ runner.temp }}/arf.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Serial console
        if: failure() && matrix.image == 'hardening' && steps.build.outcome != 'skipped'
        run: |
          cat "${RUNNER_TEMP}/vm/qemu.log" "${RUNNER_TEMP}/vm/console.log" 2> /dev/null || true

      - name: Stop qemu
        if: always() && matrix.image == 'hardening' && steps.build.outcome != 'skipped'
        run: |
          kill "$(cat "${RUNNER_TEMP}/vm/qemu.pid" 2> /dev/null)" 2> /dev/null || true

      - name: Save the pass set for the next scan
        if: always() && matrix.image == 'hardening' && steps.build.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/baseline.json
          key: scap-machine-${{ matrix.image }}-${{ github.run_id }}
