---
name: Build the collection
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legs:
    name: Choose the legs for this event
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          always='[
            {"image":"collection","family":"fedora","base":"quay.io/fedora/fedora-bootc:44"},
            {"image":"bootc-base","family":"debian","base":"docker.io/library/debian:forky"},
            {"image":"bootc-base","family":"ubuntu","base":"docker.io/library/ubuntu:26.04"},
            {"image":"bootc-base","family":"rhel","base":"quay.io/rockylinux/rockylinux:10"},
            {"image":"hardening","family":"rhel","base":"quay.io/centos-bootc/centos-bootc:stream10"},
            {"image":"changed","family":"fedora","base":"quay.io/fedora/fedora-bootc:44"},
            {"image":"changed","family":"debian","base":"docker.io/library/debian:forky"},
            {"image":"changed","family":"ubuntu","base":"docker.io/library/ubuntu:26.04"}
          ]'
          deb='[
            {"image":"collection","family":"debian","base":"docker.io/library/debian:forky"},
            {"image":"collection","family":"ubuntu","base":"docker.io/library/ubuntu:26.04"}
          ]'
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            printf 'include=%s\n' "$(jq -c . <<< "$always")" >> "$GITHUB_OUTPUT"
          else
            printf 'include=%s\n' "$(jq -c -s add <<< "${always}${deb}")" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint the collection's shell
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install shfmt
        env:
          SHFMT_VERSION: "3.13.1"
        run: |
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt

      - name: Lint
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find . -path ./.git -prune -o -name '*.sh' -type f \
            ! \( -path '*/files/*' \( -path '*/libexec/*' -o -path '*/system-generators/*' \) \) -print)
          mapfile -t repos < <(find . -path ./.git -prune -o -name repo -type f -print)
          mapfile -t helpers < <(find . -path ./.git -prune -o -path '*/files/*' -type f \
            \( -path '*/libexec/*' -o -path '*/system-generators/*' \) -print)
          shellcheck -s bash "${scripts[@]}"
          shellcheck -s bash -e SC2034 "${repos[@]}"
          shellcheck "${helpers[@]}"
          shfmt -i 4 -ci -bn -sr -d "${scripts[@]}" "${repos[@]}" "${helpers[@]}"
          echo "::notice::${#scripts[@]} scripts, ${#repos[@]} repo files and ${#helpers[@]} helpers are clean"

  packages:
    name: package lists ${{ matrix.family }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: debian
            base: docker.io/library/debian:forky
          - family: ubuntu
            base: docker.io/library/ubuntu:26.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Resolve every package this family declares
        env:
          FAMILY: ${{ matrix.family }}
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          python3 .github/packages.py "$FAMILY" > lists.txt
          python3 .github/packages.py "$FAMILY" --repos > repos.txt
          echo "::notice::$(wc -l < lists.txt) modules declare packages for ${FAMILY}, $(wc -l < repos.txt) of them out of an archive of their own"
          sudo podman run --rm -i -v "${PWD}:/src:ro" "$BASE" \
            bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              mkdir -p /ctx/lib
              cp /src/deb-family/build-environment/lib/family.sh /ctx/lib/
              while read -r repo; do source "/src/$repo"; done < /src/repos.txt
              if [ -s /src/repos.txt ]; then apt-get update -qq; fi
              rc=0
              while read -r module packages; do
                if apt-get install --dry-run -qq $packages > /dev/null 2>&1; then
                  printf "ok   %s\n" "$module"
                else
                  printf "FAIL %s\n" "$module"
                  apt-get install --dry-run $packages 2>&1 | grep -E "^E:" | head -3
                  rc=1
                fi
              done < /src/lists.txt
              exit $rc
            '

  collection:
    name: ${{ matrix.image }} ${{ matrix.family }}
    needs: [legs, lint, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.legs.outputs.include) }}
    env:
      IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      IMAGE: ${{ matrix.image }}
      FAMILY: ${{ matrix.family }}
      # These components cannot build in isolation, so the leg leaves them to a maintainer.
      SKIP: system-menu/goojust system-menu/power-scripts boot/uki boot/secureboot-enrolment
      HARDENING: updates/signature-policy
      CONFORMS: cis_server_l1
      MAX_FAILS: "7"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: ${{ matrix.image == 'changed' && '0' || '1' }}

      - name: Install shfmt
        env:
          SHFMT_VERSION: "3.13.1"
        run: |
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          sudo chmod +x /usr/local/bin/shfmt

      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium
          df -h /

      - name: Settle the container storage driver
        run: |
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf > /dev/null
          sudo podman system reset --force > /dev/null 2>&1 || true
          sudo rm -rf /var/lib/containers/storage /run/containers/storage
          sudo podman info --format 'storage: {{.Store.GraphDriverName}} {{.Store.GraphOptions}}'

      # The released binary reads its assets from the tarball, not from a copy on the runner.
      - name: Install the released tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/tect"
          mkdir -p "$dir"
          gh release download --repo buildc-org/buildc --dir "$dir" \
            --pattern 'tect-v*-x86_64-linux-musl.tar.gz*'
          (cd "$dir" && printf '%s  %s\n' "$(cat ./*.sha256)" ./*.tar.gz \
            | sha256sum --check --status)
          tar -xzf "$dir"/*.tar.gz -C "$dir"
          printf 'sources {\n    buildc-org "%s"\n}\n' "$GITHUB_WORKSPACE" \
            > "${dir}/assets/repo.sources.kdl"
          {
            echo "ROOT=${RUNNER_TEMP}/collection"
            echo "NAMES=${RUNNER_TEMP}/names"
            echo "BUILDC_BIN=${dir}/tect"
            echo "BUILDC_ASSETS=${dir}/assets"
          } >> "${GITHUB_ENV}"

      - name: Choose this leg's modules
        env:
          FROM: ${{ github.event.pull_request.base.sha }}
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          case "$IMAGE" in
            collection)
              mapfile -t all < <(find . -mindepth 2 -name module.kdl -not -path './.*' \
                -printf '%h\n' | sed 's|^\./||' | sort)
              python3 .github/closure.py --split "$FAMILY" "$BASE" "${all[@]}" \
                | awk -v n="$NAMES" '{ print $2 > ($1 == 0 ? n : n "." $1) }'
              for alt in "${NAMES}".[0-9]*; do
                [ -e "$alt" ] || continue
                echo "::notice::$(wc -l < "$alt") modules in ${IMAGE}-${alt##*.}"
                cat "$alt"
              done
              ;;
            bootc-base)
              dir=deb-family
              [ "$FAMILY" = rhel ] && dir=rhel-family
              find "$dir" -mindepth 2 -name module.kdl -printf '%h\n' \
                | sort -u | xargs -r python3 .github/closure.py "$FAMILY" "$BASE" > "$NAMES"
              ;;
            hardening)
              {
                printf '%s\n' $HARDENING
                find hardening -mindepth 2 -name module.kdl -printf '%h\n'
              } | sort -u \
                | xargs -r python3 .github/closure.py "$FAMILY" "$BASE" > "$NAMES"
              ;;
            changed)
              # A push or a manual run has no pull request base, so the leg diffs the previous commit.
              from="${FROM:-$(git rev-parse -q --verify HEAD^ || true)}"
              : > "$NAMES"
              if [ -n "$from" ]; then
                git diff --name-only "$from" HEAD | while read -r file; do
                  dir="$(dirname "$file")"
                  while [ "$dir" != "." ]; do
                    if [ -f "${dir}/module.kdl" ]; then
                      echo "$dir"
                      break
                    fi
                    dir="$(dirname "$dir")"
                  done
                done | sort -u \
                  | xargs python3 .github/closure.py "$FAMILY" "$BASE" > "$NAMES"
              fi
              ;;
          esac
          echo "::notice::$(wc -l < "$NAMES") modules in the ${IMAGE} leg"
          cat "$NAMES"

      # The hardening leg imports only rhel components, so a claim from another family is never measured.
      - name: Refuse a claim outside the hardening set
        if: matrix.image == 'hardening'
        run: |
          set -euo pipefail
          claiming="$(grep -rlE '^[[:space:]]*satisfies' --include=module.kdl . \
            | sed 's|^\./||;s|/module\.kdl$||' | sort)"
          stray="$(comm -23 <(printf '%s\n' "$claiming") <(sort "$NAMES") || true)"
          if [ -n "$stray" ]; then
            printf '%s\n' "$stray"
            echo '::error::a module declares `satisfies` and no leg measures it'
            exit 1
          fi

      - name: Scaffold a repository on this collection
        env:
          BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          "$BUILDC_BIN" create repo "$IMAGE" --root "$ROOT" --no-tui \
            --owner buildc-org --host github.com \
            --image "$IMAGE" --base "$BASE"
          alts=("${NAMES}".[0-9]*)
          for alt in "${alts[@]}"; do
            "$BUILDC_BIN" create image "${IMAGE}-${alt##*.}" --root "$ROOT" --no-tui \
              --owner buildc-org --base "$BASE"
          done
          if [ "$IMAGE" = hardening ]; then
            image="${ROOT}/${IMAGE}.image.kdl"
            bases="$(grep -c '^    base "' "$image" || true)"
            if [ "$bases" != 1 ]; then
              echo "::error::${image} declares ${bases} images; the conforms splice writes one"
              exit 1
            fi
            sed -i "s|^    base \"|    conforms \"${CONFORMS}\"\n\n    base \"|" \
              "$image"
            wrote="$(grep -cx "    conforms \"${CONFORMS}\"" "$image" || true)"
            if [ "$wrote" != 1 ]; then
              echo "::error::${image} carries ${wrote} of that conforms, expected one"
              exit 1
            fi
          fi
          case "$FAMILY" in
          debian|ubuntu)
            for image in "${ROOT}"/*.image.kdl; do
              sed -i "s|^        family \"fedora\"$|        family \"${FAMILY}\"|" "$image"
              grep -q '^        requires "bootc-base"$' "$image" \
                || sed -i "s|^        family \"${FAMILY}\"$|        family \"${FAMILY}\"\n        requires \"bootc-base\"|" "$image"
              for want in "        family \"${FAMILY}\"" '        requires "bootc-base"'; do
                [ "$(grep -cx "$want" "$image")" = 1 ] || {
                  echo "::error::${image} does not carry exactly one \`${want# *}\`"
                  exit 1
                }
              done
            done
            if [ "$FAMILY" = ubuntu ]; then
              repo="${ROOT}/repo.kdl"
              sed -i '/^    build-disk$/d' "$repo"
              [ "$(grep -cx '    build-disk' "$repo" || true)" = 0 ] || {
                echo "::error::${repo} still declares build-disk"
                exit 1
              }
            fi
            ;;
          esac
          declare -A keyed=()
          import_into() {
          local image="$1" name
          while read -r name; do
            case " $SKIP " in *" $name "*) continue ;; esac
            grep -q "^supports .*\"${FAMILY}\"" "${name}/module.kdl" || continue
            if grep -q "module \"${name}\"" "${ROOT}/${image}.image.kdl"; then
              continue
            fi
            "$BUILDC_BIN" import module "buildc-org/${name}" --root "$ROOT" \
              --image "$image" --no-tui
            [ -z "${keyed[$name]:-}" ] || continue
            keyed[$name]=1
            case "$name" in
              boot/cachyos-kernel)
                "$BUILDC_BIN" create key secureboot --root "$ROOT" --no-tui \
                  --cn "Collection CI"
                ;;
              login-access)
                "$BUILDC_BIN" create key ssh --root "$ROOT" --no-tui
                ;;
              updates/signature-policy)
                mkdir -p "$ROOT/keys/public/etc/pki/containers"
                openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
                  | openssl pkey -pubout \
                    -out "$ROOT/keys/public/etc/pki/containers/cosign.pub"
                ;;
            esac
          done < "$2"
          }
          import_into "$IMAGE" "$NAMES"
          for alt in "${alts[@]}"; do
            import_into "${IMAGE}-${alt##*.}" "$alt"
          done
          cd "$ROOT" && "$BUILDC_BIN" generate

      - name: Run lint
        run: |
          "${ROOT}/scripts/lint.sh"

      - name: Run the tests the collection ships
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t names < <(sort -u "$NAMES" "${NAMES}".[0-9]*)
          if [ "${#names[@]}" -eq 0 ]; then
            echo "no modules in this leg"
            exit 0
          fi
          mapfile -t dirs < <(find "${names[@]}" -name 'test_*.py' -type f \
            -exec dirname {} \; | sort -u)
          for dir in ${dirs[@]+"${dirs[@]}"}; do
            python3 -m unittest discover -s "$dir" -v
          done

      - name: Report where modules overlap
        if: matrix.image == 'collection'
        run: |
          set -euo pipefail
          rows="$(jq -r '
            .images[].targets[]
            | (.overlay_overridden[]
               | "- `\(.path)`: `\(.module)` ships it, `\(.by)` wins"),
              (.modules
               | map(.provides[] as $c | {c: $c, m: .path})
               | group_by(.c)[] | select(length > 1)
               | "- `\(.[0].c)`: \(map("`\(.m)`") | join(", "))")
          ' "${ROOT}/generated/plan.json")"
          {
            echo "## Where ${FAMILY} modules overlap"
            echo
            echo "What one module ships and another replaces, and what two of"
            echo "them provide. Read it; it is not a failure."
            echo
            printf '%s\n' "${rows:-None.}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        id: build
        if: >-
          matrix.image != 'changed'
          && (matrix.family == 'fedora' || matrix.image == 'bootc-base'
              || github.event_name != 'pull_request')
        run: |
          set -euo pipefail
          echo "::group::${IMAGE} Containerfile"
          cat "${ROOT}/generated/${IMAGE}/Containerfile"
          echo "::endgroup::"
          cd "$ROOT" && sudo IMAGE_REGISTRY="$IMAGE_REGISTRY" \
            "$BUILDC_BIN" build --no-tui
          shopt -s nullglob
          previous="$IMAGE"
          for alt in "${NAMES}".[0-9]*; do
            target="${IMAGE}-${alt##*.}"
            # Each image is removed before the next build to stay inside the runner's disk budget.
            sudo podman rmi --ignore "${previous}:latest" > /dev/null
            sudo podman image prune -f > /dev/null
            echo "::group::${target} Containerfile"
            cat "${ROOT}/generated/${target}/Containerfile"
            echo "::endgroup::"
            sudo IMAGE_REGISTRY="$IMAGE_REGISTRY" "$BUILDC_BIN" build --no-tui --target "$target"
            previous="$target"
          done

      - name: Lint the built base
        if: matrix.image == 'bootc-base'
        run: |
          set -euo pipefail
          sudo podman run --rm --entrypoint '' "${IMAGE}:latest" \
            bootc container lint --fatal-warnings --no-truncate
          pages="$(sudo podman run --rm --entrypoint '' "${IMAGE}:latest" \
            sh -c 'find /usr/share/man/man1 -maxdepth 1 -type f | wc -l')"
          echo "::notice::the ${FAMILY} bootc base carries ${pages} man1 pages"
          [ "$pages" -gt 0 ]

      - name: Restore the last scan's pass set
        if: matrix.image == 'hardening' && steps.build.outcome != 'skipped'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/baseline.json
          key: scap-machine-${{ matrix.image }}-${{ github.run_id }}
          restore-keys: scap-machine-${{ matrix.image }}-

      - name: Boot the image
        if: matrix.image == 'hardening' && steps.build.outcome != 'skipped'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          sudo chmod 666 /dev/kvm
          "${ROOT}/scripts/smoke.sh" "${IMAGE}:latest" "${RUNNER_TEMP}/vm"

      - name: Evaluate the rules
        if: matrix.image == 'hardening' && steps.build.outcome != 'skipped'
        run: |
          set -euo pipefail
          # The VM's host key is new each run, so the SSH calls do not pin it.
          s() {
            ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o LogLevel=ERROR -i "${RUNNER_TEMP}/vm/key" -p 2222 root@localhost "$@"
          }
          content="$(cd "$ROOT" && "$BUILDC_BIN" scap content --target "$IMAGE")"
          # The scanner installs into /usr, which bootc keeps read-only without the overlay.
          s bootc usr-overlay
          s 'n=0
            until dnf -y install openscap-scanner scap-security-guide >/dev/null; do
              n=$((n+1))
              [ "$n" -ge 3 ] && exit 1
              dnf clean all
              sleep 15
            done'
          s cat "$content" > "${RUNNER_TEMP}/ds.xml"
          (cd "$ROOT" && "$BUILDC_BIN" scap tailoring --target "$IMAGE" \
            --datastream "${RUNNER_TEMP}/ds.xml") | s 'cat > /tmp/tailoring.xml'
          # A failed rule makes oscap exit non-zero, so the check reads the result file instead.
          s oscap xccdf eval \
            --tailoring-file /tmp/tailoring.xml --profile xccdf_tect_profile_measured \
            --results-arf /tmp/arf.xml "$content" || true
          s cat /tmp/arf.xml > "${RUNNER_TEMP}/arf.xml"
          [ -s "${RUNNER_TEMP}/arf.xml" ]
          echo "DATASTREAM=${RUNNER_TEMP}/ds.xml" >> "$GITHUB_ENV"

      - name: Compare what was declared to what was measured
        if: matrix.image == 'hardening' && steps.build.outcome != 'skipped'
        run: |
          set -euo pipefail
          report="$("$BUILDC_BIN" scap "${RUNNER_TEMP}/arf.xml" \
            --root "$ROOT" --target "$IMAGE" --datastream "$DATASTREAM" \
            --base-scan "${GITHUB_WORKSPACE}/.ci/centos-bootc-stream10-base-scan.json" \
            --baseline "${RUNNER_TEMP}/baseline.json")"
          printf '%s\n' "$report"
          rows="$(printf '%s\n' "$report" | grep '^| buildc-org/' || true)"
          if [ -z "$rows" ]; then
            echo '::error::the report declared no claim at all'; exit 1
          fi
          bad="$(printf '%s\n' "$rows" | grep -v '| pass |$' || true)"
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            echo '::error::a declared claim was not measured as passing'; exit 1
          fi

          case "$report" in
            *'this run is the baseline.'* | \
              *'Nothing that passed before stopped passing.'*) ;;
            *)
              echo '::error::a rule that passed the last scan does not now'
              exit 1
              ;;
          esac

          fails="$(printf '%s\n' "$report" \
            | awk -F'|' '/\(declared\)/ { gsub(/ /, "", $5); print $5 }')"
          if [ -z "$fails" ]; then
            echo "::error::no profile row is declared, so ${CONFORMS} is not a"\
              "profile this datastream carries"
            exit 1
          fi
          echo "::notice::${IMAGE} fails ${fails} of ${CONFORMS}, floor ${MAX_FAILS}"
          if [ "$fails" -gt "$MAX_FAILS" ]; then
            echo "::error::${fails} failures against a declared floor of"\
              "${MAX_FAILS}; fix them, or choose a new floor deliberately"
            exit 1
          fi
          if [ "$fails" -lt "$MAX_FAILS" ]; then
            echo "::notice::the floor is loose and could come down to ${fails}"
          fi

      - name: Keep the scan report
        if: always() && matrix.image == 'hardening' && steps.build.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arf-${{ matrix.image }}
          path: ${{ runner.temp }}/arf.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Serial console
        if: failure() && matrix.image == 'hardening' && steps.build.outcome != 'skipped'
        run: |
          cat "${RUNNER_TEMP}/vm/qemu.log" "${RUNNER_TEMP}/vm/console.log" 2> /dev/null || true

      - name: Stop qemu
        if: always() && matrix.image == 'hardening' && steps.build.outcome != 'skipped'
        run: |
          kill "$(cat "${RUNNER_TEMP}/vm/qemu.pid" 2> /dev/null)" 2> /dev/null || true

      - name: Save the pass set for the next scan
        if: always() && matrix.image == 'hardening' && steps.build.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/baseline.json
          key: scap-machine-${{ matrix.image }}-${{ github.run_id }}
